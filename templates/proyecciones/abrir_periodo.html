{% extends 'base.html' %}

{% block titulo %}Abrir periodo{% endblock %}

{% block contenido %}
<h1>Abrir periodo de proyección</h1>
<p>Se creará una proyección en borrador para cada área activa. Si el año ya existe, solo se crean las que falten.</p>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Abrir periodo</button>
</form>
{% endblock %}
