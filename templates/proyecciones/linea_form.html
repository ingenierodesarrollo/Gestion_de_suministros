{% extends "base.html" %}

{% block titulo %}{{ titulo }} · Gestión de suministros{% endblock %}

{% block contenido %}
  <div class="tarjeta">
    <h1>{{ titulo }} · {{ proyeccion.area.nombre }} {{ proyeccion.periodo }}</h1>
    <form method="post">
      {% csrf_token %}
      <div class="rejilla">
        {% for campo in form %}
          <label>{{ campo.label|capfirst }}{{ campo }}{{ campo.errors }}</label>
        {% endfor %}
      </div>
      <button type="submit">Guardar línea</button>
    </form>
    <p><a href="{% url 'proyecciones:detalle' proyeccion.pk %}">Cancelar</a></p>
  </div>
{% endblock %}
