<!doctype html>
<html lang="es">
<head>
  <title>Ingresar · Gestión de suministros</title>
</head>
<body>
  <h1>Gestión de suministros</h1>
  <form method="post">
    {% csrf_token %}
    {% if form.errors %}
      <p>Correo o contraseña incorrectos. Intenta de nuevo.</p>
    {% endif %}
    <p>Correo: {{ form.username }}</p>
    <p>Contraseña: {{ form.password }}</p>
    <button type="submit">Ingresar</button>
  </form>
</body>
</html>
