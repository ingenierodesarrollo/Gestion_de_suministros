{% extends "base.html" %}

{% block titulo %}Área · Gestión de suministros{% endblock %}

{% block contenido %}
  <div class="tarjeta">
    <h1>{% if area %}Editar área{% else %}Nueva área{% endif %}</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Guardar</button>
    </form>
    <p  class="separado"><a class="boton-tabla" href="{% url 'configuracion:areas' %}">Cancelar</a></p>
  </div>
{% endblock %}
