{% extends "base.html" %}

{% block titulo %}{{ titulo }} · Gestión de suministros{% endblock %}

{% block contenido %}
  <div class="tarjeta">
    <h1>{{ titulo }}</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Guardar</button>
    </form>
    <p class="separado"><a class="boton-tabla" href="{% url volver %}">Cancelar</a></p>
  </div>
{% endblock %}
